services:
  - type: web
    # Ten service phai dung 16 ky tu de domain co do dai bang server cu,
    # giup script tools/patch_domain.py thay the truc tiep trong binary app.
    #      mduyk-key-server  = 16 ky tu (server cu)
    #      mduyk-key-srv001  = 16 ky tu (goi y cho ban)
    name: mduyk-key-srv001
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:create_app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ADMIN_KEY
        sync: false
      - key: SERVER_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
