<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login — Patch Server</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="logo">M</div>
    <h1>PATCH SERVER</h1>
    <p class="muted">Xác thực license &amp; quản lý file patch</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label>ADMIN ACCESS KEY</label>
      <input name="key" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">ĐĂNG NHẬP →</button>
    </form>
    <p class="foot">Mặc định: <code>admin123</code> (đổi qua biến môi trường <code>ADMIN_KEY</code>)</p>
  </main>
</body>
</html>
